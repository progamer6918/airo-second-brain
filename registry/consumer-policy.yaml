  claude:
    allowed_reads:
      - BOOT.md
      - CURRENT.md
      - CONTEXT.md
      - AGENTS.md
      - SECURITY.md
      - state/system-health.md
      - projects/
      - decisions/pending-decisions.md
      - docs/onboarding/
      - docs/contracts/
      - docs/architecture/
      - docs/prd/PRD_AIRO_KNOWLEDGE_CONTINUITY.md
      - docs/operations/AIRO_SESSION_WORKLOG_PROMOTION_SOP.md
      - identity/
      - systems/
      - agents/
      - meta/
      - state/operating-rules/AIRO_COUNCIL_MODE.md
