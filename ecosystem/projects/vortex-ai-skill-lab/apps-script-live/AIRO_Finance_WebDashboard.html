<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIRO Finance - Read-Only Cockpit Web Dashboard</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --accent-amber: #fbbf24;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding: 20px; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    .banner-readonly {
      background-color: rgba(251, 191, 36, 0.15);
      border: 1px solid var(--accent-amber);
      color: var(--accent-amber);
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    h1 { font-size: 24px; font-weight: 700; color: var(--text-main); }
    
    .filter-group { display: flex; gap: 12px; align-items: center; }
    .filter-group label { font-size: 14px; color: var(--text-muted); font-weight: 500; }
    select {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--accent-blue); }
    
    .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card-kpi { background-color: var(--bg-card); border-radius: 10px; padding: 20px; border: 1px solid var(--border-color); }
    .kpi-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .kpi-value { font-size: 24px; font-weight: 700; }
    .value-green { color: var(--accent-green); }
    .value-red { color: var(--accent-red); }
    .value-blue { color: var(--accent-blue); }
    .value-amber { color: var(--accent-amber); }

    .grid-sections { display: grid; grid-template-columns: 1fr; gap: 24px; margin-bottom: 24px; }
    @media (min-width: 900px) { .grid-sections { grid-template-columns: 1fr 1fr; } }

    .card { background-color: var(--bg-card); border-radius: 10px; padding: 20px; border: 1px solid var(--border-color); }
    .card h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 10px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); font-weight: 600; }
    td { padding: 10px; border-bottom: 1px solid rgba(51, 65, 85, 0.5); }
    
    .warning-box { background-color: rgba(248, 113, 113, 0.1); border-left: 4px solid var(--accent-red); padding: 10px 14px; margin-bottom: 8px; border-radius: 4px; font-size: 13px; color: #fca5a5; }
    .empty-state { text-align: center; color: var(--text-muted); padding: 20px; font-style: italic; }
    .loading { text-align: center; color: var(--accent-blue); padding: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="banner-readonly">
      <span>🔒 READ-ONLY MVP — no approval, no edit, no workbook mutation</span>
      <span id="sync-time" style="font-size:12px; font-weight:normal; opacity:0.8;">Synced: -</span>
    </div>

    <header>
      <h1>AIRO Finance Web Dashboard</h1>
      <div class="filter-group">
        <label for="month-select">Bulan:</label>
        <select id="month-select" onchange="onFilterChange()">
          <option value="1">Januari</option>
          <option value="2">Februari</option>
          <option value="3">Maret</option>
          <option value="4">April</option>
          <option value="5">Mei</option>
          <option value="6">Juni</option>
          <option value="7">Juli</option>
          <option value="8">Agustus</option>
          <option value="9">September</option>
          <option value="10">Oktober</option>
          <option value="11">November</option>
          <option value="12">Desember</option>
        </select>

        <label for="year-select">Tahun:</label>
        <select id="year-select" onchange="onFilterChange()">
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
        </select>
      </div>
    </header>

    <div id="content-area">
      <div class="loading">Memuat data dashboard...</div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var now = new Date();
      var curMonth = now.getMonth() + 1;
      var curYear = now.getFullYear();
      
      var mSelect = document.getElementById("month-select");
      var ySelect = document.getElementById("year-select");
      
      if (mSelect) mSelect.value = String(curMonth);
      if (ySelect) ySelect.value = String(curYear);
      
      fetchSnapshot(curYear, curMonth);
    });

    function onFilterChange() {
      var mSelect = document.getElementById("month-select");
      var ySelect = document.getElementById("year-select");
      var y = Number(ySelect ? ySelect.value : new Date().getFullYear());
      var m = Number(mSelect ? mSelect.value : new Date().getMonth() + 1);
      fetchSnapshot(y, m);
    }

    function fetchSnapshot(year, month) {
      document.getElementById("content-area").innerHTML = '<div class="loading">Memuat data dashboard...</div>';
      
      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(renderDashboard)
          .withFailureHandler(handleError)
          .airoWebDashboardGetClientSnapshot({ year: year, month: month });
      } else {
        setTimeout(function() {
          renderDashboard({
            ok: true,
            period: (month < 10 ? "0" + month : month) + "/" + year,
            totals: { income: 15000000, expense: 8500000, net_cashflow: 6500000, clean_expense: 8500000, excluded_rows: 0 },
            spending_intelligence: {
              top_categories: [
                { category: "Makanan & Minuman", amount: 3500000, contribution_percent: 41.18, growth_percent: null, growth_status: "NO_DATA" },
                { category: "Transportasi", amount: 2000000, contribution_percent: 23.53, growth_percent: null, growth_status: "NO_DATA" }
              ],
              top_subcategories: [
                { category: "Makanan & Minuman", subcategory: "Restoran", amount: 2000000 }
              ]
            },
            wallet_snapshot: [
              { account: "BCA", balance: 18500000, income_cumulative: 25000000, expense_cumulative: 650000, status: "ACTIVE", period_end: "2026-07-31" },
              { account: "Blu", balance: 5200000, income_cumulative: 8000000, expense_cumulative: 2800000, status: "ACTIVE", period_end: "2026-07-31" },
              { account: "Cash", balance: 1200000, income_cumulative: 2000000, expense_cumulative: 800000, status: "ACTIVE", period_end: "2026-07-31" }
            ],
            data_quality: {
              uncategorized_count: 0,
              pending_review_count: 0,
              warnings: []
            },
            recent_ledger: []
          });
        }, 300);
      }
    }

    function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function formatRp(val) {
      return "Rp " + Number(val || 0).toLocaleString("id-ID");
    }

    function handleError(err) {
      document.getElementById("content-area").innerHTML = '<div class="card"><div class="warning-box">❌ Gagal memuat data: ' + (err.message || err) + '</div></div>';
    }

    function renderDashboard(data) {
      if (!data || !data.ok) {
        handleError(data ? data.error : "Unknown error");
        return;
      }

      document.getElementById("sync-time").innerText = "Periode: " + (data.period_label || data.period);

      var html = "";
      
      // KPI Grid
      html += '<div class="grid-kpi">';
      html += '  <div class="card-kpi"><div class="kpi-title">Total Pemasukan</div><div class="kpi-value value-green">' + formatRp(data.totals.income) + '</div></div>';
      html += '  <div class="card-kpi"><div class="kpi-title">Total Pengeluaran</div><div class="kpi-value value-red">' + formatRp(data.totals.expense) + '</div></div>';
      html += '  <div class="card-kpi"><div class="kpi-title">Net Cashflow</div><div class="kpi-value ' + (data.totals.net_cashflow >= 0 ? 'value-green' : 'value-red') + '">' + formatRp(data.totals.net_cashflow) + '</div></div>';
      html += '  <div class="card-kpi"><div class="kpi-title">Clean Expense</div><div class="kpi-value value-blue">' + formatRp(data.totals.clean_expense) + '</div></div>';
      html += '</div>';

      html += '<div class="grid-sections">';
      
      // Wallet Snapshot Section
      html += '  <div class="card">';
      html += '    <h2>💳 Saldo Akun per Akhir Periode</h2>';
      if (data.wallet_snapshot && data.wallet_snapshot.length > 0) {
        html += '    <table><thead><tr><th>Akun</th><th style="text-align:right;">Saldo per Akhir Periode</th><th style="text-align:center;">As of</th></tr></thead><tbody>';
        data.wallet_snapshot.forEach(function(w) {
          var balDisplay = w.status === "NO_LEDGER_HISTORY" ? "-" : formatRp(w.balance);
          var dateDisplay = w.balance_as_of ? w.balance_as_of : "-";
          html += '      <tr><td>' + w.account + '</td><td style="text-align:right; font-weight:600;" class="' + (w.balance >= 0 ? 'value-green' : 'value-red') + '">' + balDisplay + '</td><td style="text-align:center; color:#888; font-size:12px;">' + dateDisplay + '</td></tr>';
        });
        html += '    </tbody></table>';
      } else {
        html += '    <div class="warning-box">⚠️ Saldo akun tidak tersedia untuk periode ini</div>';
      }
      html += '  </div>';

      // Spending Intelligence Section
      var topCats = (data.spending_intelligence && data.spending_intelligence.top_categories) || data.top_categories || [];
      var topSubcats = (data.spending_intelligence && data.spending_intelligence.top_subcategories) || [];

      html += '  <div class="card">';
      html += '    <h2>📊 Top Category</h2>';
      if (topCats && topCats.length > 0) {
        html += '    <table><thead><tr><th>Kategori</th><th style="text-align:right;">Jumlah</th><th style="text-align:right;">Kontribusi</th></tr></thead><tbody>';
        topCats.slice(0, 5).forEach(function(c) {
          var pct = c.contribution_percent !== undefined ? c.contribution_percent : (c.contrib_pct || 0);
          html += '      <tr><td>' + escapeHtml(c.category) + '</td><td style="text-align:right;">' + formatRp(c.amount) + '</td><td style="text-align:right;">' + pct + '%</td></tr>';
        });
        html += '    </tbody></table>';
      } else {
        html += '    <div class="empty-state">Belum ada data pengeluaran berkategori</div>';
      }
      html += '  </div>';

      html += '  <div class="card">';
      html += '    <h2>🏷️ Top Subcategory</h2>';
      if (topSubcats && topSubcats.length > 0) {
        html += '    <table><thead><tr><th>Kategori</th><th>Subkategori</th><th style="text-align:right;">Jumlah</th></tr></thead><tbody>';
        topSubcats.slice(0, 5).forEach(function(sc) {
          html += '      <tr><td>' + escapeHtml(sc.category) + '</td><td>' + escapeHtml(sc.subcategory) + '</td><td style="text-align:right;">' + formatRp(sc.amount) + '</td></tr>';
        });
        html += '    </tbody></table>';
      } else {
        html += '    <div class="empty-state">Belum ada data pengeluaran bersubkategori</div>';
      }
      html += '  </div>';

      html += '</div>'; // end grid-sections

      // Data Quality Section
      var dq = data.data_quality || {};
      var dqWarnings = dq.warnings || data.warnings || [];
      html += '<div class="card" style="margin-bottom: 24px;">';
      html += '  <h2>🛡️ Data Quality Audit</h2>';
      if (dqWarnings && dqWarnings.length > 0) {
        dqWarnings.forEach(function(w) {
          html += '  <div class="warning-box">⚠️ ' + w + '</div>';
        });
      } else {
        html += '  <div style="color: var(--accent-green); font-size:14px; font-weight:600;">✓ Data Quality OK — Tidak ada catatan atau transaksi tanpa kategori.</div>';
      }
      html += '</div>';

      document.getElementById("content-area").innerHTML = html;
    }
  </script>
</body>
</html>
